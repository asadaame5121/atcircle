name: PR Screenshots

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pr-screenshots.mjs
        env:
          E2E_DEV_PDS_URL: ${{ vars.E2E_DEV_PDS_URL }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          TEST_ALICE_PASSWORD: ${{ secrets.TEST_ALICE_PASSWORD }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const files = ["home", "rings", "ring-detail", "dashboard"];
            let body = "## UI Screenshots (dev 環境の現状)\n\n";
            for (const f of files) {
              const p = `screenshots/${f}.png`;
              if (!fs.existsSync(p)) continue;
              const data = fs.readFileSync(p).toString("base64");
              body += `### ${f}\n\n![${f}](data:image/png;base64,${data})\n\n`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (
                c.user.login === "github-actions[bot]" &&
                c.body?.startsWith("## UI Screenshots")
              ) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
